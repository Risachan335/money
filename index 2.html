<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff7fb">
<title>MY MONEY</title>
<style>
:root{--pink:#e9a7c5;--pink2:#fff0f6;--ink:#443b40;--muted:#9a8e94;--line:#eee5e9;--danger:#d97878;--ok:#79a889;--card:#fff}
*{box-sizing:border-box}body{margin:0;background:#faf7f8;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}button,input,select{font:inherit}button{border:0;background:none;color:inherit}.app{max-width:560px;margin:auto;min-height:100vh;padding:18px 16px 90px}header{display:flex;justify-content:space-between;align-items:center;margin:4px 2px 18px}.logo{font-weight:800;letter-spacing:.12em;font-size:15px}.cycle{font-size:12px;color:var(--muted)}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 4px 18px #6b4b5b0b;margin-bottom:14px}.hero{background:linear-gradient(145deg,#fff7fb,#fff);text-align:center;padding:26px 18px}.label{font-size:12px;color:var(--muted);letter-spacing:.05em}.money{font-size:38px;font-weight:800;margin:8px 0 2px;letter-spacing:.02em}.sub{font-size:12px;color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mini h3{margin:6px 0 0;font-size:21px}.mini p{margin:0;font-size:12px;color:var(--muted)}.section-title{font-size:14px;font-weight:800;margin:22px 4px 10px}.row{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.cat{font-weight:700}.remain{font-weight:800}.neg{color:var(--danger)}.pos{color:var(--ok)}.progress{height:9px;background:#f1e9ed;border-radius:99px;overflow:hidden;margin:10px 0}.bar{height:100%;background:var(--pink);border-radius:99px}.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;width:min(528px,calc(100% - 32px));padding:15px;border-radius:18px;background:var(--pink);color:white;font-weight:800;box-shadow:0 10px 25px #b76b8b44}nav{display:flex;gap:6px;margin-bottom:18px}.tab{flex:1;padding:10px 5px;border-radius:14px;font-size:12px;color:var(--muted)}.tab.active{background:#fff;border:1px solid var(--line);color:var(--ink);font-weight:800}.hidden{display:none!important}.muted{color:var(--muted)}.small{font-size:12px}form .field{margin-bottom:13px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}input,select{width:100%;padding:13px 12px;border:1px solid var(--line);border-radius:13px;background:#fff;color:var(--ink);outline:none}input:focus,select:focus{border-color:var(--pink)}.primary{width:100%;padding:14px;border-radius:14px;background:var(--pink);color:#fff;font-weight:800}.secondary{padding:10px 13px;border-radius:13px;background:var(--pink2);font-weight:700;font-size:12px}.danger{color:var(--danger);font-size:12px}.list-item{padding:13px 0;border-bottom:1px solid var(--line)}.list-top{display:flex;justify-content:space-between;gap:8px;font-weight:700}.list-meta{font-size:11px;color:var(--muted);margin-top:4px}.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:#443b40;color:#fff;padding:10px 15px;border-radius:99px;font-size:12px;z-index:10}.detail-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.detail-title{font-weight:800;font-size:15px}.pill{display:inline-block;background:var(--pink2);border-radius:99px;padding:5px 9px;font-size:11px}.credit-total{font-size:28px;font-weight:800;margin:7px 0}.credit-note{font-size:11px;color:var(--muted)}.history-card{padding:17px 18px}.history-card+.history-card{margin-top:10px}.summary-num{font-size:19px;font-weight:800}.two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mini-stat{background:#fff7fb;border-radius:15px;padding:12px}.mini-stat .small{margin-bottom:4px}
</style>
</head>
<body>
<div class="app">
<header><div class="logo">MY MONEY ♡</div><div id="cycle" class="cycle"></div></header>
<nav><button class="tab active" data-page="home">ホーム</button><button class="tab" data-page="input">支出入力</button><button class="tab" data-page="history">履歴</button><button class="tab" data-page="settings">設定</button></nav>

<section id="home">
<div class="card hero"><div id="currentDate" class="label" style="font-size:13px;color:#6f6269;margin-bottom:10px"></div><div class="label">今使えるお金</div><div id="available" class="money">¥0</div><div id="today" class="sub"></div><div id="paydayCountdown" class="sub" style="margin-top:5px"></div></div>
<div class="grid"><div class="card mini"><p>今月の貯金</p><h3 id="monthSave">¥0</h3></div><div class="card mini"><p>現在の貯金</p><h3 id="savings">¥0</h3></div></div>
<div class="card"><div class="row"><span>給料</span><b id="income">¥0</b></div><div class="row"><span>確保するお金</span><b id="reserved">¥0</b></div><div class="row"><span>支出</span><b id="spent">¥0</b></div><div class="row"><span>今月の貯金</span><b id="saveRow">¥0</b></div></div>
<div class="section-title">今月のクレジット引き落とし予定</div>
<div class="card"><div class="label">今月支払うクレジット</div><div id="creditDue" class="credit-total">¥0</div><div id="creditNote" class="credit-note"></div><button class="secondary" style="margin-top:10px" onclick="showPage('history');setTimeout(()=>showCreditDetails(),0)">内訳を見る</button></div>
<div class="section-title">カテゴリー別の残り</div><div class="card" id="categories"></div>
<div class="card"><div class="label">貯金目標</div><div class="row"><span id="goalText">未設定</span><b id="goalRemain">¥0</b></div><div class="progress"><div id="goalBar" class="bar" style="width:0%"></div></div><div id="goalMonthly" class="small muted"></div></div>
<div id="carryCard" class="card hidden"></div>
</section>

<section id="input" class="hidden"><div class="section-title">支出を追加</div><div class="card"><form id="expenseForm"><div class="field"><label>金額</label><input id="amount" type="number" min="1" step="1" placeholder="例：1,280" required></div><div class="field"><label>カテゴリー</label><select id="category"></select></div><div class="field"><label>内容</label><input id="memo" maxlength="40" placeholder="例：カフェ"></div><div class="field"><label>日付</label><input id="date" type="date" required></div><div class="field"><label>支払い方法</label><select id="method"><option>現金</option><option>クレジットカード</option><option>交通系IC</option><option>その他</option></select></div><div id="creditFields" class="hidden"><div class="field"><label>クレジットの支払い</label><select id="creditType"><option value="一括">一括払い</option><option value="分割">分割払い</option></select></div><div id="installmentFields" class="hidden"><div class="field"><label>分割回数</label><input id="installmentCount" type="number" min="2" max="60" value="2"></div><div class="field"><label>毎月の支払額（カード明細に合わせて入力）</label><input id="installmentMonthly" type="number" min="0" step="1" placeholder="例：5,000"></div></div></div><button class="primary">保存する</button></form></div></section>

<section id="history" class="hidden"><div class="section-title">月別履歴</div><div id="cycleHistory"></div><div class="section-title">支出履歴</div><div class="card" id="historyList"></div><div id="creditDetails" class="card hidden"></div></section>

<section id="settings" class="hidden"><div class="section-title">今月の設定</div><div class="card"><form id="settingsForm"><div class="field"><label>給料日</label><input id="payday" type="number" min="1" max="28" required></div><div class="field"><label>今回の手取り</label><input id="incomeSet" type="number" min="0" required></div><div class="field"><label>家賃</label><input id="rent" type="number" min="0"></div><div class="field"><label>共有財布</label><input id="shared" type="number" min="0"></div><div class="field"><label>みずほ口座移行</label><input id="mizuho" type="number" min="0"></div><div class="field"><label>その他の確保額</label><input id="otherReserve" type="number" min="0"></div><div class="field"><label>今月の貯金額</label><input id="saveTarget" type="number" min="0"></div><div class="section-title" style="margin-left:0">カテゴリー予算</div><div id="budgetFields"></div><button class="primary">今月の設定を保存</button></form></div>
<div class="section-title">貯金目標</div><div class="card"><form id="goalForm"><div class="field"><label>現在の貯金額</label><input id="currentSavings" type="number" min="0" required></div><div class="field"><label>目標金額</label><input id="goalAmount" type="number" min="0" required></div><div class="field"><label>いつまでに？</label><input id="goalDate" type="date" required></div><button class="primary">貯金目標を保存</button></form></div></section>
<button class="fab" onclick="showPage('input')">＋ 支出を入力</button>
</div>
<script>
const cats=["交際費","雑貨","美容","交通費","その他"],KEY="myMoneyV1",CYCLEKEY="myMoneyCyclesV1";
const yen=n=>"¥"+Math.round(n||0).toLocaleString("ja-JP"), todayISO=()=>new Date().toISOString().slice(0,10);
let data=JSON.parse(localStorage.getItem(KEY)||"null")||{payday:25,income:0,reserved:{rent:70000,shared:10000,mizuho:0,other:0},saveTarget:0,budgets:{交際費:0,雑貨:0,美容:0,交通費:0,その他:0},expenses:[],savings:0,goal:{amount:1000000,date:"2028-03-31"}};
// 旧バージョンのNISA・携帯を、現在の「みずほ口座移行」にまとめる移行処理
if(!data.reserved)data.reserved={rent:0,shared:0,mizuho:0,other:0};
if(data.reserved.mizuho==null)data.reserved.mizuho=(+data.reserved.nisa||0)+(+data.reserved.phone||0);
delete data.reserved.nisa;delete data.reserved.phone;
if(!data.cycles)data.cycles=JSON.parse(localStorage.getItem(CYCLEKEY)||"{}")||{};
function save(){localStorage.setItem(KEY,JSON.stringify(data));localStorage.setItem(CYCLEKEY,JSON.stringify(data.cycles||{}))}
function cycleStartFor(baseDate){const now=new Date(baseDate),day=Number(data.payday)||25;let y=now.getFullYear(),m=now.getMonth();if(now.getDate()<day)m--;return new Date(y,m,day)}
function cycleEndFor(baseDate){const s=cycleStartFor(baseDate);return new Date(s.getFullYear(),s.getMonth()+1,s.getDate()-1)}
function cycleKey(baseDate){const s=cycleStartFor(baseDate);return isoDate(s)}
function isoDate(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function cycleStart(){return cycleStartFor(new Date())}function cycleEnd(){return cycleEndFor(new Date())}
function inCycle(e,baseDate=new Date()){let d=new Date(e.date+"T00:00:00");return d>=cycleStartFor(baseDate)&&d<=cycleEndFor(baseDate)}
function cycleExpenses(baseDate=new Date()){return data.expenses.filter(e=>inCycle(e,baseDate))}
function reservedTotal(){return Object.values(data.reserved).reduce((a,b)=>a+(+b||0),0)}
function spent(baseDate=new Date()){return cycleExpenses(baseDate).reduce((a,e)=>a+(+e.amount||0),0)}
function formatJPDate(d){const w=["日","月","火","水","木","金","土"];return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日（${w[d.getDay()]}）`}
function nextPayday(){const now=new Date(),day=Number(data.payday)||25;let d=new Date(now.getFullYear(),now.getMonth(),day);if(now>=d)d=new Date(now.getFullYear(),now.getMonth()+1,day);return d}
function snapshotCurrentCycle(){const s=cycleStart(),k=isoDate(s);if(!data.cycles[k])data.cycles[k]={start:k,end:isoDate(cycleEnd()),income:data.income,reserved:{...data.reserved},saveTarget:data.saveTarget,budgets:{...data.budgets},createdAt:new Date().toISOString()};else{const c=data.cycles[k];c.income=data.income;c.reserved={...data.reserved};c.saveTarget=data.saveTarget;c.budgets={...data.budgets}};save()}
function historicalCycles(){const map={...data.cycles};const starts=new Set();data.expenses.forEach(e=>starts.add(cycleKey(new Date(e.date+"T00:00:00"))));starts.forEach(k=>{if(!map[k]){const d=new Date(k+"T00:00:00"), ex=cycleExpenses(d);map[k]={start:k,end:isoDate(cycleEndFor(d)),income:0,reserved:{rent:0,shared:0,mizuho:0,other:0},saveTarget:0,budgets:{...data.budgets},createdAt:null,legacy:true,expenseOnly:true}});return map}
function creditDueForCurrentCycle(){
 const start=cycleStart(), prevBase=new Date(start.getFullYear(),start.getMonth(),start.getDate()-1);
 const prevEx=cycleExpenses(prevBase).filter(e=>e.method==="クレジットカード");
 let due=0, one=0, inst=0;
 // 一括払いは「前サイクルに使った分」を今サイクルの支払いとして表示
 prevEx.forEach(e=>{if((e.creditType||"一括")==="一括"){one+=+e.amount||0;due+=+e.amount||0}else{inst+=+(e.installmentMonthly||0);due+=+(e.installmentMonthly||0)}});
 // 以前のデータには分割情報がないため、登録時点で情報を追加したものだけ分割分を集計
 return {due,one,inst,prevCount:prevEx.length,prevEx};
}
function render(){
 snapshotCurrentCycle();const s=cycleStart(),e=cycleEnd(),ex=cycleExpenses(),now=new Date();document.getElementById("currentDate").textContent=formatJPDate(now);const np=nextPayday(),days=Math.max(0,Math.ceil((np-now)/86400000));document.getElementById("paydayCountdown").textContent=days===0?"今日は給料日♡":`給料日まであと ${days}日`;document.getElementById("cycle").textContent=`${s.getMonth()+1}/${s.getDate()}〜${e.getMonth()+1}/${e.getDate()}`;
 const avail=data.income-reservedTotal()-data.saveTarget-spent();document.getElementById("available").textContent=yen(avail);document.getElementById("available").className="money "+(avail<0?"neg":"");const cycleDays=Math.max(1,Math.ceil((e-now)/86400000)+1);document.getElementById("today").textContent=`サイクル残り${cycleDays}日｜1日あたり目安 ${yen(Math.max(0,avail)/cycleDays)}`;document.getElementById("income").textContent=yen(data.income);document.getElementById("reserved").textContent=yen(reservedTotal());document.getElementById("spent").textContent=yen(spent());document.getElementById("saveRow").textContent=yen(data.saveTarget);document.getElementById("monthSave").textContent=yen(data.saveTarget);document.getElementById("savings").textContent=yen(data.savings);
 document.getElementById("categories").innerHTML=cats.map(c=>{const used=ex.filter(x=>x.category===c).reduce((a,x)=>a+(+x.amount||0),0),rem=(+data.budgets[c]||0)-used;return `<div class="row"><span class="cat">${c}</span><span class="remain ${rem<0?"neg":""}">${yen(rem)}${rem<0?"（超過）":""}</span></div>`}).join("");
 const cd=creditDueForCurrentCycle();document.getElementById("creditDue").textContent=yen(cd.due);document.getElementById("creditNote").textContent=`前サイクルの一括 ${yen(cd.one)} ＋ 分割 ${yen(cd.inst)} を今月の支払予定として表示`;
 const g=data.goal,remain=Math.max(0,(+g.amount||0)-data.savings),pct=g.amount?Math.min(100,data.savings/g.amount*100):0;document.getElementById("goalText").textContent=g.amount?`${yen(data.savings)} / ${yen(g.amount)}`:"未設定";document.getElementById("goalRemain").textContent=yen(remain);document.getElementById("goalBar").style.width=pct+"%";let months=0;if(g.amount&&g.date)months=Math.max(1,Math.ceil((new Date(g.date)-new Date())/(30.44*86400000)));document.getElementById("goalMonthly").textContent=g.amount?`目標日までに必要：約 ${yen(remain/months)} / 月`:"";
 const negatives=cats.map(c=>({c,used:ex.filter(x=>x.category===c).reduce((a,x)=>a+x.amount,0),b:+data.budgets[c]||0})).filter(x=>x.used>x.b);const cc=document.getElementById("carryCard");if(negatives.length){cc.classList.remove("hidden");cc.innerHTML="<b>今月の使いすぎ</b><div class='small muted' style='margin-top:6px'>月が変わっても、前月の超過額は履歴に残ります。</div>"+negatives.map(x=>`<div class="row"><span>${x.c}</span><b class="neg">−${yen(x.used-x.b).slice(1)}</b></div>`).join("")}else cc.classList.add("hidden");
 renderHistory();fillSettings();
}
function cycleSummary(c){const d=new Date(c.start+"T00:00:00"),ex=cycleExpenses(d),income=+c.income||0,res=Object.values(c.reserved||{}).reduce((a,b)=>a+(+b||0),0),saveT=+c.saveTarget||0,sp=ex.reduce((a,x)=>a+(+x.amount||0),0),net=income-res-saveT-sp;const over=cats.map(cat=>{const used=ex.filter(x=>x.category===cat).reduce((a,x)=>a+x.amount,0);return {cat,used,budget:+(c.budgets||{})[cat]||0,remain:(+(c.budgets||{})[cat]||0)-used}});return {d,ex,income,res,saveT,sp,net,over}}
function renderHistory(){
 const cycles=historicalCycles();const keys=Object.keys(cycles).sort().reverse();document.getElementById("cycleHistory").innerHTML=keys.length?keys.map(k=>{const s=cycleSummary(cycles[k]);const label=`${s.d.getMonth()+1}/${s.d.getDate()}〜${new Date(cycles[k].end+"T00:00:00").getMonth()+1}/${new Date(cycles[k].end+"T00:00:00").getDate()}`;return `<div class="card history-card"><div class="detail-head"><div><span class="pill">給料サイクル</span><div class="detail-title" style="margin-top:7px">${label}</div></div><button class="secondary" onclick="showCycleDetail('${k}')">詳細</button></div><div class="two-col" style="margin-top:12px"><div class="mini-stat"><div class="small muted">収入</div><div class="summary-num">${yen(s.income)}</div></div><div class="mini-stat"><div class="small muted">使ったお金</div><div class="summary-num">${yen(s.res+s.sp+s.saveT)}</div></div></div><div class="row"><span>残り</span><b class="${s.net<0?"neg":"pos"}">${yen(s.net)}</b></div></div>`}).join(""):"<div class='card muted small'>まだ月別データがありません。</div>";
 const list=[...data.expenses].sort((a,b)=>b.date.localeCompare(a.date));document.getElementById("historyList").innerHTML=list.length?list.map(x=>`<div class="list-item"><div class="list-top"><span>${x.category}　${x.memo||""}</span><span>${yen(x.amount)}</span></div><div class="list-meta">${x.date} ・ ${x.method}${x.method==="クレジットカード"?` ・ ${x.creditType||"一括"}`:""}</div></div>`).join(""):"<div class='muted small'>まだ支出がありません。</div>";
}
function showCycleDetail(k){const c=historicalCycles()[k],s=cycleSummary(c);const rows=[`<div class="label">${s.d.getMonth()+1}/${s.d.getDate()}〜${new Date(c.end+"T00:00:00").getMonth()+1}/${new Date(c.end+"T00:00:00").getDate()}</div>`,`<div class="row"><span>収入</span><b>${yen(s.income)}</b></div>`,`<div class="row"><span>家賃・共有財布など</span><b>${yen(s.res)}</b></div>`,`<div class="row"><span>今月の貯金</span><b>${yen(s.saveT)}</b></div>`,`<div class="row"><span>カテゴリー支出</span><b>${yen(s.sp)}</b></div>`];rows.push('<div class="section-title" style="margin-left:0">カテゴリー別</div>');s.over.forEach(x=>rows.push(`<div class="row"><span>${x.cat}</span><span>${yen(x.used)} / 予算 ${yen(x.budget)} <b class="${x.remain<0?"neg":""}">（${x.remain<0?"超過 ":"残り "}${yen(Math.abs(x.remain))}）</b></span></div>`));rows.push(`<div class="row"><span>最終的な残り</span><b class="${s.net<0?"neg":"pos"}">${yen(s.net)}</b></div>`);document.getElementById("creditDetails").classList.remove("hidden");document.getElementById("creditDetails").innerHTML=`<div class="detail-head"><b>月の詳細</b><button class="secondary" onclick="document.getElementById('creditDetails').classList.add('hidden')">閉じる</button></div>${rows.join("")}`;document.getElementById("creditDetails").scrollIntoView({behavior:"smooth",block:"start"})}
function showCreditDetails(){const cd=creditDueForCurrentCycle(),box=document.getElementById("creditDetails");box.classList.remove("hidden");box.innerHTML=`<div class="detail-head"><b>今月のクレジット内訳</b><button class="secondary" onclick="this.parentElement.parentElement.classList.add('hidden')">閉じる</button></div><div class="row"><span>前サイクルの一括払い</span><b>${yen(cd.one)}</b></div><div class="row"><span>前サイクルの分割払い</span><b>${yen(cd.inst)}</b></div><div class="row"><span>今月の支払予定</span><b>${yen(cd.due)}</b></div><div class="small muted" style="margin-top:10px">※カード会社によって締め日・引き落とし日は違うので、このアプリでは「前の給料サイクルに使ったクレジットが次のサイクルに支払われる」前提で管理します。</div>`;box.scrollIntoView({behavior:"smooth",block:"start"})}
function fillSettings(){const vals={payday:data.payday,incomeSet:data.income,rent:data.reserved.rent,shared:data.reserved.shared,mizuho:data.reserved.mizuho,otherReserve:data.reserved.other,saveTarget:data.saveTarget};Object.keys(vals).forEach(id=>document.getElementById(id).value=vals[id]??0);document.getElementById("budgetFields").innerHTML=cats.map(c=>`<div class="field"><label>${c}</label><input data-budget="${c}" type="number" min="0" value="${data.budgets[c]||0}"></div>`).join("");document.getElementById("currentSavings").value=data.savings;document.getElementById("goalAmount").value=data.goal.amount||0;document.getElementById("goalDate").value=data.goal.date||""}
function showPage(p){document.querySelectorAll("section").forEach(s=>s.classList.add("hidden"));document.getElementById(p).classList.remove("hidden");document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t.dataset.page===p));window.scrollTo(0,0);if(p!=="history")document.getElementById("creditDetails").classList.add("hidden")}
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>showPage(t.dataset.page));document.getElementById("date").value=todayISO();document.getElementById("category").innerHTML=cats.map(c=>`<option>${c}</option>`).join("");
document.getElementById("method").onchange=()=>{document.getElementById("creditFields").classList.toggle("hidden",method.value!=="クレジットカード")};document.getElementById("creditType").onchange=()=>{document.getElementById("installmentFields").classList.toggle("hidden",creditType.value!=="分割")};
document.getElementById("expenseForm").onsubmit=ev=>{ev.preventDefault();const item={amount:+amount.value,category:category.value,memo:memo.value,date:date.value,method:method.value};if(method.value==="クレジットカード"){item.creditType=creditType.value;if(creditType.value==="分割"){item.installmentCount=+installmentCount.value||2;item.installmentMonthly=+installmentMonthly.value||0}}data.expenses.push(item);save();ev.target.reset();date.value=todayISO();document.getElementById("creditFields").classList.add("hidden");document.getElementById("installmentFields").classList.add("hidden");showPage("home");render();toast("支出を保存しました♡")};
document.getElementById("settingsForm").onsubmit=ev=>{ev.preventDefault();data.payday=+payday.value;data.income=+incomeSet.value;data.reserved={rent:+rent.value||0,shared:+shared.value||0,mizuho:+mizuho.value||0,other:+otherReserve.value||0};data.saveTarget=+saveTarget.value||0;document.querySelectorAll("[data-budget]").forEach(i=>data.budgets[i.dataset.budget]=+i.value||0);save();render();toast("今月の設定を保存しました♡")};
document.getElementById("goalForm").onsubmit=ev=>{ev.preventDefault();data.savings=+currentSavings.value||0;data.goal={amount:+goalAmount.value||0,date:goalDate.value};save();render();toast("貯金目標を保存しました♡")};
function toast(t){let x=document.createElement("div");x.className="toast";x.textContent=t;document.body.appendChild(x);setTimeout(()=>x.remove(),1500)}
render();
</script></body></html>
