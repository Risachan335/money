<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff7fb">
<title>MY MONEY</title>
<style>
:root{--pink:#e9a7c5;--pink2:#fff0f6;--ink:#443b40;--muted:#9a8e94;--line:#eee5e9;--danger:#d97878;--ok:#79a889;--card:#fff}
*{box-sizing:border-box} body{margin:0;background:#faf7f8;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
button,input,select{font:inherit} button{border:0;background:none;color:inherit}
.app{max-width:560px;margin:auto;min-height:100vh;padding:18px 16px 90px}
header{display:flex;justify-content:space-between;align-items:center;margin:4px 2px 18px}
.logo{font-weight:800;letter-spacing:.12em;font-size:15px}.cycle{font-size:12px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 4px 18px #6b4b5b0b;margin-bottom:14px}
.hero{background:linear-gradient(145deg,#fff7fb,#fff);text-align:center;padding:26px 18px}
.label{font-size:12px;color:var(--muted);letter-spacing:.05em}.money{font-size:38px;font-weight:800;margin:8px 0 2px;letter-spacing:.02em}.sub{font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mini h3{margin:6px 0 0;font-size:21px}.mini p{margin:0;font-size:12px;color:var(--muted)}
.section-title{font-size:14px;font-weight:800;margin:22px 4px 10px}
.row{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}
.cat{font-weight:700}.remain{font-weight:800}.neg{color:var(--danger)}.pos{color:var(--ok)}
.progress{height:9px;background:#f1e9ed;border-radius:99px;overflow:hidden;margin:10px 0}.bar{height:100%;background:var(--pink);border-radius:99px}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;width:min(528px,calc(100% - 32px));padding:15px;border-radius:18px;background:var(--pink);color:white;font-weight:800;box-shadow:0 10px 25px #b76b8b44}
nav{display:flex;gap:6px;margin-bottom:18px}.tab{flex:1;padding:10px 5px;border-radius:14px;font-size:12px;color:var(--muted)}.tab.active{background:#fff;border:1px solid var(--line);color:var(--ink);font-weight:800}
.hidden{display:none!important}.muted{color:var(--muted)}.small{font-size:12px}
form .field{margin-bottom:13px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}input,select{width:100%;padding:13px 12px;border:1px solid var(--line);border-radius:13px;background:#fff;color:var(--ink);outline:none}input:focus,select:focus{border-color:var(--pink)}
.primary{width:100%;padding:14px;border-radius:14px;background:var(--pink);color:#fff;font-weight:800}.secondary{padding:12px 14px;border-radius:13px;background:var(--pink2);font-weight:700}
.danger{color:var(--danger);font-size:12px}
.list-item{padding:13px 0;border-bottom:1px solid var(--line)}.list-top{display:flex;justify-content:space-between;font-weight:700}.list-meta{font-size:11px;color:var(--muted);margin-top:4px}
.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:#443b40;color:#fff;padding:10px 15px;border-radius:99px;font-size:12px;z-index:10}
</style>
</head>
<body>
<div class="app">
<header><div class="logo">MY MONEY ♡</div><div id="cycle" class="cycle"></div></header>
<nav>
<button class="tab active" data-page="home">ホーム</button>
<button class="tab" data-page="input">支出入力</button>
<button class="tab" data-page="history">履歴</button>
<button class="tab" data-page="settings">設定</button>
</nav>

<section id="home">
<div class="card hero">
<div id="currentDate" class="label" style="font-size:13px;color:#6f6269;margin-bottom:10px"></div>
<div class="label">今使えるお金</div>
<div id="available" class="money">¥0</div>
<div id="today" class="sub"></div>
<div id="paydayCountdown" class="sub" style="margin-top:5px"></div>
</div>
<div class="grid">
<div class="card mini"><p>今月の貯金</p><h3 id="monthSave">¥0</h3></div>
<div class="card mini"><p>現在の貯金</p><h3 id="savings">¥0</h3></div>
</div>
<div class="card">
<div class="row"><span>給料</span><b id="income">¥0</b></div>
<div class="row"><span>確保するお金</span><b id="reserved">¥0</b></div>
<div class="row"><span>支出</span><b id="spent">¥0</b></div>
<div class="row"><span>今月の貯金</span><b id="saveRow">¥0</b></div>
</div>
<div class="section-title">カテゴリー別の残り</div>
<div class="card" id="categories"></div>
<div class="card">
<div class="label">貯金目標</div>
<div class="row"><span id="goalText">未設定</span><b id="goalRemain">¥0</b></div>
<div class="progress"><div id="goalBar" class="bar" style="width:0%"></div></div>
<div id="goalMonthly" class="small muted"></div>
</div>
<div id="carryCard" class="card hidden"></div>
</section>

<section id="input" class="hidden">
<div class="section-title">支出を追加</div>
<div class="card">
<form id="expenseForm">
<div class="field"><label>金額</label><input id="amount" type="number" min="1" step="1" placeholder="例：1280" required></div>
<div class="field"><label>カテゴリー</label><select id="category"></select></div>
<div class="field"><label>内容</label><input id="memo" maxlength="40" placeholder="例：カフェ"></div>
<div class="field"><label>日付</label><input id="date" type="date" required></div>
<div class="field"><label>支払い方法</label><select id="method"><option>現金</option><option>クレジットカード</option><option>交通系IC</option><option>その他</option></select></div>
<button class="primary">保存する</button>
</form>
</div>
</section>

<section id="history" class="hidden">
<div class="section-title">支出履歴</div>
<div class="card" id="historyList"></div>
</section>

<section id="settings" class="hidden">
<div class="section-title">今月の設定</div>
<div class="card">
<form id="settingsForm">
<div class="field"><label>給料日</label><input id="payday" type="number" min="1" max="28" required></div>
<div class="field"><label>今回の手取り</label><input id="incomeSet" type="number" min="0" required></div>
<div class="field"><label>家賃</label><input id="rent" type="number" min="0"></div>
<div class="field"><label>共有財布</label><input id="shared" type="number" min="0"></div>
<div class="field"><label>NISA</label><input id="nisa" type="number" min="0"></div>
<div class="field"><label>携帯</label><input id="phone" type="number" min="0"></div>
<div class="field"><label>その他の確保額</label><input id="otherReserve" type="number" min="0"></div>
<div class="field"><label>今月の貯金額</label><input id="saveTarget" type="number" min="0"></div>
<div class="section-title" style="margin-left:0">カテゴリー予算</div>
<div id="budgetFields"></div>
<button class="primary">今月の設定を保存</button>
</form>
</div>

<div class="section-title">貯金目標</div>
<div class="card">
<form id="goalForm">
<div class="field"><label>現在の貯金額</label><input id="currentSavings" type="number" min="0" required></div>
<div class="field"><label>目標金額</label><input id="goalAmount" type="number" min="0" required></div>
<div class="field"><label>いつまでに？</label><input id="goalDate" type="date" required></div>
<button class="primary">貯金目標を保存</button>
</form>
</div>
</section>

<button class="fab" onclick="showPage('input')">＋ 支出を入力</button>
</div>
<script>
const cats=["交際費","雑貨","美容","交通費","その他"];
const KEY="myMoneyV1";
const yen=n=>"¥"+Math.round(n||0).toLocaleString("ja-JP");
const todayISO=()=>new Date().toISOString().slice(0,10);
let data=JSON.parse(localStorage.getItem(KEY)||"null")||{
  payday:25,income:0,reserved:{rent:70000,shared:10000,nisa:0,phone:0,other:0},
  saveTarget:0,budgets:{交際費:0,雑貨:0, 美容:0,交通費:0,その他:0},expenses:[],
  savings:0,goal:{amount:1000000,date:"2028-03-31"}
};
function save(){localStorage.setItem(KEY,JSON.stringify(data));}
function cycleStart(){
 const now=new Date(), day=Number(data.payday)||25;
 let y=now.getFullYear(),m=now.getMonth();
 if(now.getDate()<day)m--;
 return new Date(y,m,day);
}
function cycleEnd(){const s=cycleStart();return new Date(s.getFullYear(),s.getMonth()+1,s.getDate()-1)}
function inCycle(e){let d=new Date(e.date+"T00:00:00");return d>=cycleStart()&&d<=cycleEnd()}
function cycleExpenses(){return data.expenses.filter(inCycle)}
function reservedTotal(){return Object.values(data.reserved).reduce((a,b)=>a+(+b||0),0)}
function spent(){return cycleExpenses().reduce((a,e)=>a+e.amount,0)}
function formatJPDate(d){
 const weekdays=["日","月","火","水","木","金","土"];
 return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日（${weekdays[d.getDay()]}）`;
}
function nextPayday(){
 const now=new Date(), day=Number(data.payday)||25;
 let d=new Date(now.getFullYear(),now.getMonth(),day);
 if(now>=d)d=new Date(now.getFullYear(),now.getMonth()+1,day);
 return d;
}
function render(){
 const s=cycleStart(),e=cycleEnd(), ex=cycleExpenses();
 const now=new Date();
 document.getElementById("currentDate").textContent=formatJPDate(now);
 const np=nextPayday();
 const days=Math.max(0,Math.ceil((np-now)/86400000));
 document.getElementById("paydayCountdown").textContent=days===0?"今日は給料日♡":`給料日まであと ${days}日`;

 document.getElementById("cycle").textContent=`${s.getMonth()+1}/${s.getDate()}〜${e.getMonth()+1}/${e.getDate()}`;
 const avail=data.income-reservedTotal()-data.saveTarget-spent();
 document.getElementById("available").textContent=yen(avail);
 document.getElementById("available").className="money "+(avail<0?"neg":"");
 const cycleDays=Math.max(1,Math.ceil((e-new Date())/86400000)+1);
 document.getElementById("today").textContent=`サイクル残り${cycleDays}日｜1日あたり目安 ${yen(Math.max(0,avail)/cycleDays)}`;
 document.getElementById("income").textContent=yen(data.income);
 document.getElementById("reserved").textContent=yen(reservedTotal());
 document.getElementById("spent").textContent=yen(spent());
 document.getElementById("saveRow").textContent=yen(data.saveTarget);
 document.getElementById("monthSave").textContent=yen(data.saveTarget);
 document.getElementById("savings").textContent=yen(data.savings);
 document.getElementById("categories").innerHTML=cats.map(c=>{
   const used=ex.filter(x=>x.category===c).reduce((a,x)=>a+x.amount,0), rem=data.budgets[c]-used;
   return `<div class="row"><span class="cat">${c}</span><span class="remain ${rem<0?"neg":""}">${yen(rem)}${rem<0?"（超過）":""}</span></div>`;
 }).join("");
 const g=data.goal, remain=Math.max(0,g.amount-data.savings), pct=g.amount?Math.min(100,data.savings/g.amount*100):0;
 document.getElementById("goalText").textContent=g.amount?`¥${data.savings.toLocaleString()} / ${g.amount.toLocaleString()}`:"未設定";
 document.getElementById("goalRemain").textContent=yen(remain);
 document.getElementById("goalBar").style.width=pct+"%";
 let months=0;if(g.amount&&g.date){months=Math.max(1,(new Date(g.date)-new Date())/(30.44*86400000));}
 document.getElementById("goalMonthly").textContent=g.amount?`目標日までに必要：約 ${yen(remain/months)} / 月`:"";
 const negatives=cats.map(c=>({c,used:ex.filter(x=>x.category===c).reduce((a,x)=>a+x.amount,0),b:data.budgets[c]})).filter(x=>x.used>x.b);
 const cc=document.getElementById("carryCard");
 if(negatives.length){cc.classList.remove("hidden");cc.innerHTML="<b>前月からの使いすぎ</b><div class='small muted' style='margin-top:6px'>今月の予算には影響させず、記録として引き継ぎます。</div>"+negatives.map(x=>`<div class="row"><span>${x.c}</span><b class="neg">−${yen(x.used-x.b).slice(1)}</b></div>`).join("")}else cc.classList.add("hidden");
 renderHistory();fillSettings();
}
function renderHistory(){
 const list=[...data.expenses].sort((a,b)=>b.date.localeCompare(a.date));
 document.getElementById("historyList").innerHTML=list.length?list.map(x=>`<div class="list-item"><div class="list-top"><span>${x.category}　${x.memo||""}</span><span>${yen(x.amount)}</span></div><div class="list-meta">${x.date} ・ ${x.method}</div></div>`).join(""):"<div class='muted small'>まだ支出がありません。</div>";
}
function fillSettings(){
 ["payday","incomeSet","rent","shared","nisa","phone","otherReserve","saveTarget"].forEach(id=>document.getElementById(id).value={
 payday:data.payday,incomeSet:data.income,rent:data.reserved.rent,shared:data.reserved.shared,nisa:data.reserved.nisa,phone:data.reserved.phone,otherReserve:data.reserved.other,saveTarget:data.saveTarget
 }[id]);
 document.getElementById("budgetFields").innerHTML=cats.map(c=>`<div class="field"><label>${c}</label><input data-budget="${c}" type="number" min="0" value="${data.budgets[c]||0}"></div>`).join("");
 document.getElementById("currentSavings").value=data.savings;
 document.getElementById("goalAmount").value=data.goal.amount||0;
 document.getElementById("goalDate").value=data.goal.date||"";
}
function showPage(p){document.querySelectorAll("section").forEach(s=>s.classList.add("hidden"));document.getElementById(p).classList.remove("hidden");document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t.dataset.page===p));window.scrollTo(0,0)}
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>showPage(t.dataset.page));
document.getElementById("date").value=todayISO();
document.getElementById("category").innerHTML=cats.map(c=>`<option>${c}</option>`).join("");
document.getElementById("expenseForm").onsubmit=ev=>{ev.preventDefault();data.expenses.push({amount:+amount.value,category:category.value,memo:memo.value,date:date.value,method:method.value});save();ev.target.reset();date.value=todayISO();showPage("home");render();toast("支出を保存しました♡")};
document.getElementById("settingsForm").onsubmit=ev=>{ev.preventDefault();data.payday=+payday.value;data.income=+incomeSet.value;data.reserved={rent:+rent.value||0,shared:+shared.value||0,nisa:+nisa.value||0,phone:+phone.value||0,other:+otherReserve.value||0};data.saveTarget=+saveTarget.value||0;document.querySelectorAll("[data-budget]").forEach(i=>data.budgets[i.dataset.budget]=+i.value||0);save();render();toast("今月の設定を保存しました♡")};
document.getElementById("goalForm").onsubmit=ev=>{ev.preventDefault();data.savings=+currentSavings.value||0;data.goal={amount:+goalAmount.value||0,date:goalDate.value};save();render();toast("貯金目標を保存しました♡")};
function toast(t){let x=document.createElement("div");x.className="toast";x.textContent=t;document.body.appendChild(x);setTimeout(()=>x.remove(),1500)}
render();
</script>
</body></html>
