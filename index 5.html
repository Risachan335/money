<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="apple-mobile-web-app-capable" content="yes"><title>わたしの家計簿</title><style>
*{box-sizing:border-box}body{margin:0;background:#fffafb;color:#443b3f;font-family:-apple-system,BlinkMacSystemFont,"Yu Gothic",sans-serif}header{padding:20px;background:#fff3f7;border-bottom:1px solid #f0dce4;position:sticky;top:0;z-index:2}h1{margin:0;font-size:21px}.sub{font-size:12px;color:#96868d;margin-top:4px}main{max-width:700px;margin:auto;padding:14px 14px 90px}.tab{display:none}.tab.active{display:block}.card{background:white;border:1px solid #f0dce4;border-radius:17px;padding:16px;margin-bottom:12px}.title{font-weight:800;font-size:16px;margin-bottom:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.label{font-size:12px;color:#96868d}.big{font-size:27px;font-weight:800;margin-top:3px}.danger{color:#c85d6d}.muted{color:#96868d;font-size:12px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.item{padding:11px 0;border-bottom:1px solid #f4e8ec}.item:last-child{border:0}input,select,button{font:inherit}input,select,textarea{width:100%;padding:10px;border:1px solid #ead8df;border-radius:10px;background:#fff;color:#443b3f}textarea{min-height:70px}.field{margin:10px 0}.field label{display:block;font-size:12px;color:#96868d;margin-bottom:5px}button{border:0;border-radius:11px;padding:10px 13px;background:#fff0f5;color:#8d5268;font-weight:700}button.primary{background:#e49ab7;color:white}button.delete{background:#fff0f0;color:#b65c66;font-size:12px}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ead8df;display:grid;grid-template-columns:repeat(4,1fr);z-index:5;padding-bottom:env(safe-area-inset-bottom)}.nav button{border-radius:0;background:white;color:#96868d;font-size:11px;padding:8px}.nav button.active{color:#b65d7c;background:#fff5f8}hr{border:0;border-top:1px solid #f0dce4;margin:14px 0}details{padding:10px 0;border-bottom:1px solid #f4e8ec}summary{font-weight:700}
</style></head><body><header><h1>🧸 わたしの家計簿</h1><div class="sub" id="today"></div></header><main>
<section id="home" class="tab active"></section><section id="expense" class="tab"></section><section id="history" class="tab"></section><section id="settings" class="tab"></section></main>
<nav class="nav"><button data-t="home" class="active">🏠<br>ホーム</button><button data-t="expense">✏️<br>支出</button><button data-t="history">📊<br>月別</button><button data-t="settings">⚙️<br>設定</button></nav>
<script>
const KEY="moneyAppFinal";const cats=["交際費","雑貨","美容","交通費","その他","食費"];const yen=n=>"¥"+Number(n||0).toLocaleString("ja-JP");const iso=()=>new Date().toISOString().slice(0,10);
function fresh(){return{settings:{payday:25,income:0,rent:70000,shared:10000,mizuho:0,other:0,save:0,totalSave:0,goal:1000000,target:""},expenses:[],existing:[],installments:[]}}
let d=JSON.parse(localStorage.getItem(KEY)||"null");
if(!d){for(const k of ["risa_money_v5","risa_money_v4","risa_money_v3","moneyApp","moneyData"]){try{d=JSON.parse(localStorage.getItem(k)||"null");if(d)break}catch(e){}}}
d=d||fresh();
function save(){localStorage.setItem(KEY,JSON.stringify(d))}
function start(date=new Date()){let x=new Date(date),p=+d.settings.payday||25;if(x.getDate()<p)x.setMonth(x.getMonth()-1);return new Date(x.getFullYear(),x.getMonth(),p)}
function key(date=new Date()){return start(date).toISOString().slice(0,10)}
function label(k){let s=new Date(k+"T00:00:00"),e=new Date(s);e.setMonth(e.getMonth()+1);e.setDate(e.getDate()-1);return `${s.getMonth()+1}/${s.getDate()}〜${e.getMonth()+1}/${e.getDate()}`}
function incycle(e,k){let s=new Date(k+"T00:00:00"),x=new Date(s);x.setMonth(x.getMonth()+1);x.setDate(x.getDate()-1);let q=new Date(e.date+"T00:00:00");return q>=s&&q<=x}
function exps(k){return d.expenses.filter(e=>incycle(e,k))}
function variable(k){return exps(k).reduce((a,e)=>a+e.amount,0)}
function fixed(){let s=d.settings;return +s.rent+ +s.shared+ +s.mizuho+ +s.other}
function due(){return d.existing.reduce((a,e)=>a+ +e.monthly,0)+d.installments.reduce((a,e)=>a+ +e.monthly,0)}
function cardMonthTotal(date=new Date()){let y=date.getFullYear(),m=date.getMonth();return d.expenses.filter(e=>e.method==="クレジットカード"&&(()=>{let q=new Date(e.date+"T00:00:00");return q.getFullYear()===y&&q.getMonth()===m})()).reduce((a,e)=>a+ +e.amount,0)}
function available(k=key()){return +d.settings.income-fixed()-+d.settings.save-variable(k)}
function cat(k,c){return exps(k).filter(e=>e.category===c).reduce((a,e)=>a+e.amount,0)}
function render(){document.getElementById("today").textContent=new Date().toLocaleDateString("ja-JP",{year:"numeric",month:"long",day:"numeric",weekday:"short"});home();expense();history();settings()}
function home(){let k=key(),s=start(),n=new Date(s);n.setMonth(n.getMonth()+1);let days=Math.max(0,Math.ceil((n-new Date())/86400000)),a=available(k);document.getElementById("home").innerHTML=`
<div class="card"><div class="label">家計簿期間</div><div class="title">${label(k)}</div><div class="grid"><div><div class="label">今月使えるお金</div><div class="big ${a<0?"danger":""}">${yen(a)}</div></div><div><div class="label">現在の貯金</div><div class="big">${yen(d.settings.totalSave)}</div></div></div><hr><div class="row"><span class="muted">次の給料日まで</span><b>${days}日</b></div></div>
<div class="card"><div class="title">💳 カード利用額（1日〜月末）</div><div class="big">${yen(cardMonthTotal())}</div><div class="muted">今月のカレンダー期間で集計。予算からは購入日で差し引き。</div></div>
<div class="card"><div class="title">💳 今月のクレジット引き落とし予定</div><div class="big">${yen(due())}</div><div class="muted">既存の分割 ${yen(d.existing.reduce((a,e)=>a+ +e.monthly,0))} ＋ 新しく登録した分割 ${yen(d.installments.reduce((a,e)=>a+ +e.monthly,0))}</div></div>
<div class="card"><div class="title">今月の支出カテゴリ</div>${cats.map(c=>`<div class="item row"><span>${c}</span><b>${yen(cat(k,c))}</b></div>`).join("")}</div>`}
function expense(){let k=key(),es=exps(k).slice().reverse();document.getElementById("expense").innerHTML=`
<div class="card"><div class="title">✏️ 支出を登録</div><form id="ef"><div class="field"><label>金額</label><input id="a" type="number" required></div><div class="field"><label>カテゴリー</label><select id="c">${cats.map(x=>`<option>${x}</option>`).join("")}</select></div><div class="field"><label>内容・メモ</label><input id="m"></div><div class="field"><label>日付</label><input id="dt" type="date" value="${iso()}"></div><div class="field"><label>支払方法</label><select id="pm"><option>現金</option><option>銀行口座</option><option>クレジットカード</option><option>その他</option></select></div><div id="cf" style="display:none"><div class="field"><label>分割回数</label><input id="cnt" type="number" min="2" value="3"></div><div class="field"><label>毎月の支払額</label><input id="mon" type="number"></div></div><button class="primary">登録する</button></form></div>
<div class="card"><div class="title">${label(k)}の登録履歴</div>${es.map(e=>`<div class="item"><div class="row"><b>${e.category}</b><b>${yen(e.amount)}</b></div><div class="muted">${e.date} ・ ${e.memo||""} ・ ${e.method}</div><button class="delete" onclick="delExp(${e.id})">削除</button></div>`).join("")||'<div class="muted">まだありません</div>'}</div>`;
document.getElementById("pm").onchange=()=>{document.getElementById("cf").style.display=document.getElementById("pm").value==="クレジットカード"?"block":"none"};document.getElementById("ef").onsubmit=addExp}
function addExp(ev){ev.preventDefault();const A=document.getElementById("a"),C=document.getElementById("c"),M=document.getElementById("m"),DT=document.getElementById("dt"),PM=document.getElementById("pm"),MON=document.getElementById("mon"),CNT=document.getElementById("cnt");let e={id:Date.now(),amount:+A.value,category:C.value,memo:M.value,date:DT.value,method:PM.value};if(!e.amount||!e.date){alert("金額と日付を入力してね");return}d.expenses.push(e);if(PM.value==="クレジットカード"&&MON.value)d.installments.push({label:M.value||"カード分割",monthly:+MON.value,count:+CNT.value||1,start:key(new Date(DT.value+"T00:00:00"))});save();render();alert("登録したよ♡")}
function delExp(id){d.expenses=d.expenses.filter(e=>e.id!==id);save();render()}
function history(){let ks=[...new Set([key(),...d.expenses.map(e=>key(new Date(e.date+"T00:00:00")))])].sort().reverse();document.getElementById("history").innerHTML=`<div class="card"><div class="title">📊 月別履歴</div>${ks.map(k=>`<details><summary>${label(k)}　${yen(available(k))}</summary><div style="padding-top:10px"><div class="grid"><div><div class="label">収入</div><b>${yen(d.settings.income)}</b></div><div><div class="label">使ったお金</div><b>${yen(fixed()+d.settings.save+variable(k))}</b></div></div><hr>${cats.map(c=>`<div class="row item"><span>${c}</span><b>${yen(cat(k,c))}</b></div>`).join("")}</div></details>`).join("")}</div>`}
function settings(){let s=d.settings;document.getElementById("settings").innerHTML=`<div class="card"><div class="title">⚙️ 毎月の設定</div>${field("給料日","payday",s.payday,"number")}${field("月収（手取り）","income",s.income,"number")}${field("家賃","rent",s.rent,"number")}${field("共用財布","shared",s.shared,"number")}${field("みずほ口座移行","mizuho",s.mizuho,"number")}${field("その他の固定・取り分け","other",s.other,"number")}${field("今月の貯金額","save",s.save,"number")}<button class="primary" onclick="saveSet()">設定を保存</button></div>
<div class="card"><div class="title">💰 貯金目標</div>${field("現在の貯金額","totalSave",s.totalSave,"number")}${field("貯金目標","goal",s.goal,"number")}${field("目標日","target",s.target,"date")}<div class="muted">目標まであと ${yen(Math.max(0,s.goal-s.totalSave))}</div></div>
<div class="card"><div class="title">💳 既存の分割払い</div><div class="muted">このアプリを使い始める前からある分割払いを登録。</div><form id="old"><div class="field"><label>カード・内容</label><input id="ol"></div><div class="field"><label>残り総額</label><input id="ob" type="number"></div><div class="field"><label>毎月の引き落とし額</label><input id="om" type="number"></div><div class="field"><label>残り回数</label><input id="or" type="number"></div><button class="primary">追加する</button></form>${d.existing.map((e,i)=>`<div class="item"><div class="row"><b>${e.label}</b><button class="delete" onclick="delOld(${i})">削除</button></div><div>${yen(e.monthly)}/月 ・ 残り${e.remaining}回</div><div class="muted">残り総額 ${yen(e.balance)}</div></div>`).join("")}</div>`;document.getElementById("old").onsubmit=addOld}
function field(l,k,v,t){return `<div class="field"><label>${l}</label><input id="s_${k}" type="${t}" value="${v??""}"></div>`}
function saveSet(){["payday","income","rent","shared","mizuho","other","save","totalSave","goal","target"].forEach(k=>{const el=document.getElementById("s_"+k);d.settings[k]=k==="target"?el.value:+el.value||0});save();render();alert("保存したよ♡")}
function addOld(e){e.preventDefault();d.existing.push({label:ol.value||"既存の分割払い",balance:+ob.value||0,monthly:+om.value||0,remaining:+or.value||0});save();render();alert("追加したよ♡")}
function delOld(i){d.existing.splice(i,1);save();render()}
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));document.getElementById(b.dataset.t).classList.add("active");document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));b.classList.add("active");scrollTo(0,0)});render();
</script></body></html>
